# vigil — the plugin auditd starts to hand this machine's audit events to the agent.
#
# NOTHING HERE IS IN EFFECT UNTIL AUDITD IS RESTARTED:
#
#     systemctl restart auditd        (or: service auditd restart)
#
# On auditd older than 3.0 this directory is /etc/audisp/plugins.d — copy the file there.

active = yes
direction = out
path = /usr/sbin/vigil-audit-plugin
type = always
format = string
