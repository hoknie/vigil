# The console socket lives here. 0700 because the socket itself being 0600 is not enough on a
# machine with other local users: a directory only root may enter closes the same door twice.
d /run/vigil 0700 root root -

# Baselines, install_id and the findings journal — the agent's memory. Losing it is losing the
# comparison every finding is made of, so nothing in the packaging ever removes it.
d /var/lib/vigil 0700 root root -

# Where the shipped example points the ndjson reporter. Created even when no reporter is
# configured.
d /var/log/vigil 0700 root root -
