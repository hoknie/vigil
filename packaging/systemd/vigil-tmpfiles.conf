# The console socket lives here. 0700 as well as the socket's own 0600: on a host with other
# local users the directory closes the same door a second time.
d /run/vigil 0700 root root -

# Baselines, install_id and the findings journal: the agent's memory, and the comparison every
# finding is made of. Nothing in the packaging ever removes it.
d /var/lib/vigil 0700 root root -

# The nftables ruleset, written by vigil-firewall.service and read by the agent. The agent
# never writes here.
d /var/lib/vigil/firewall 0700 root root -

# Where the shipped example points the ndjson reporter. Created even when no reporter is
# configured.
d /var/log/vigil 0700 root root -
