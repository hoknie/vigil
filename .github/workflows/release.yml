name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_NET_RETRY: 10

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: gate
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  packages:
    needs: gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: The tag and Cargo.toml agree
        if: github.ref_type == 'tag'
        run: ./env/scripts/release.sh check-tag "$TAG"

      - name: Static musl binaries
        run: ./env/scripts/package.sh binaries

      - name: deb, built on debian:12
        run: |
          docker run --rm --volume "$PWD":/work --workdir /work --env TARGET \
            debian:12 ./env/scripts/package.sh deb
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: rpm, built on almalinux:9
        run: |
          docker run --rm --volume "$PWD":/work --workdir /work --env TARGET \
            almalinux:9 bash -c 'dnf -y -q install rpm-build >/dev/null && ./env/scripts/package.sh rpm'
          sudo chown -R "$(id -u):$(id -g)" dist

      - name: The deb installs, runs and is removed on a clean debian:12
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm --volume "$PWD":/work --workdir /work \
            debian:12 timeout -s KILL 300 ./env/scripts/package-check.sh deb

      - name: The rpm installs, runs and is removed on a clean almalinux:9
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          docker run --rm --volume "$PWD":/work --workdir /work \
            almalinux:9 timeout -s KILL 300 ./env/scripts/package-check.sh rpm

      - name: The assets collect
        run: ./env/scripts/release.sh collect

      - uses: actions/upload-artifact@v7
        with:
          name: vigil-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: gate
    runs-on: macos-14
    env:
      TARGET: universal-apple-darwin
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: The tag and Cargo.toml agree
        if: github.ref_type == 'tag'
        run: ./env/scripts/release.sh check-tag "$TAG"

      - name: Lint, as macOS compiles it
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests, as macOS runs them
        run: cargo test --workspace

      - name: Universal binaries, the .pkg and the .tar.gz, checked
        run: ./env/scripts/package-macos.sh all

      - name: The assets collect
        run: ./env/scripts/release.sh collect

      - uses: actions/upload-artifact@v7
        with:
          name: vigil-${{ env.TARGET }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [packages, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist/release
          pattern: vigil-*
          merge-multiple: true

      - name: The tag and Cargo.toml agree
        run: ./env/scripts/release.sh check-tag "$TAG"

      - name: SHA256SUMS
        run: ./env/scripts/release.sh checksums

      - name: Release notes, from the changelog
        run: ./env/scripts/release.sh notes > "$RUNNER_TEMP/release-notes.md"

      - name: Publish
        run: |
          case "$TAG" in
          *-*|*~*) marking=(--prerelease) ;;
          *) marking=(--latest) ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "vigil $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${marking[@]}"
            gh release upload "$TAG" --clobber dist/release/*
          else
            gh release create "$TAG" \
              --title "vigil $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag \
              "${marking[@]}" \
              dist/release/*
          fi
