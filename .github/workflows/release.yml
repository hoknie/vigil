name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    uses: ./.github/workflows/ci.yml
    with:
      set: full

  packages:
    needs: gate
    uses: ./.github/workflows/packages.yml

  publish:
    needs: packages
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist/release
          pattern: vigil-*
          merge-multiple: true

      - name: The tag and Cargo.toml agree
        run: ./env/scripts/release.sh check-tag "$TAG"

      - name: SHA256SUMS
        run: ./env/scripts/release.sh checksums

      - name: Release notes, from the changelog
        run: ./env/scripts/release.sh notes > "$RUNNER_TEMP/release-notes.md"

      - name: Publish
        run: |
          case "$TAG" in
          *-*|*~*) marking=(--prerelease) ;;
          *) marking=(--latest) ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "vigil $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${marking[@]}"
            gh release upload "$TAG" --clobber dist/release/*
          else
            gh release create "$TAG" \
              --title "vigil $TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag \
              "${marking[@]}" \
              dist/release/*
          fi

  homebrew:
    needs: publish
    if: github.ref_type == 'tag' && !contains(github.ref_name, '-') && !contains(github.ref_name, '~')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      TAP: hoknie/homebrew-vigil
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: The tag and Cargo.toml agree
        run: ./env/scripts/release.sh check-tag "$TAG"

      - name: The archive and its checksums, from the release
        run: |
          mkdir -p dist/release
          gh release download "$TAG" --dir dist/release \
            --pattern 'vigil_*.macos.universal.tar.gz' --pattern SHA256SUMS

      - name: The formula
        run: ./env/scripts/homebrew.sh formula

      - name: The formula is an asset of the release
        run: gh release upload "$TAG" --clobber dist/release/vigil.rb

      - name: The formula is committed to the tap
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the formula is an asset of the release and the tap is not updated"
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" "$RUNNER_TEMP/tap"
          ./env/scripts/homebrew.sh publish "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git add Formula/vigil.rb README.md
          if git diff --cached --quiet; then
            echo "the tap already holds this formula"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --message "vigil ${TAG#v}"
          git push origin HEAD
