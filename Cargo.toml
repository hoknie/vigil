[workspace]
resolver = "3"
members = [
    "crates/vigil-model",
    "crates/vigil-rules",
    "crates/vigil-collect",
    "crates/vigil-store",
    "crates/vigil-report",
    "bin/vigild",
    "bin/vigil",
    "bin/vigil-audit-plugin",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"

[workspace.dependencies]
sha2 = { version = "0.10", default-features = false }
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "color",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
