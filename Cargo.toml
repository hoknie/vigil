[workspace]
resolver = "3"
members = [
    "crates/core/vigil-model",
    "crates/core/vigil-config",
    "crates/core/vigil-rules",
    "crates/core/vigil-collect",
    "crates/core/vigil-view",
    "crates/core/vigil-module",
    "crates/collectors/vigil-network",
    "crates/collectors/vigil-users",
    "crates/collectors/vigil-firewall",
    "crates/collectors/vigil-containers",
    "crates/collectors/vigil-engines",
    "crates/collectors/vigil-files",
    "crates/collectors/vigil-persistence",
    "crates/collectors/vigil-processes",
    "crates/collectors/vigil-launches",
    "crates/collectors/vigil-resources",
    "crates/consumers/vigil-store",
    "crates/consumers/vigil-report",
    "bin/vigild",
    "bin/vigil",
    "bin/vigil-audit-plugin",
    "bin/vigil-container-dump",
]

[workspace.package]
edition = "2024"
version = "1.0.9"
license = "Apache-2.0"

[workspace.dependencies]
rustix = { version = "1", default-features = false, features = [
    "std",
    "fs",
    "process",
] }
sha2 = { version = "0.11", default-features = false }
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
    "color",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = { version = "2", default-features = false }
serde_yaml = "0.9"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"
