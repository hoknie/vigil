state_dir: /var/lib/vigil
socket_path: /run/vigil/vigil.sock
retention_days: 90

collectors:
  - ports
  - users
  - persistence
  - processes
  - firewall
  - launches

schedule:
  ports: 30
  users: 300
  persistence: 300
  processes: 30
  firewall: 60
  launches: 15

suppressions: []

record_launch_arguments: false

reporters: []
