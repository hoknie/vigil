# Work directory of the agent: the baseline of every collector, the findings
# journal and the outgoing buffer. Root owns it, mode 0700.
state_dir: /var/lib/vigil

# The unix socket the console reads this agent over. Created 0600 and published by rename.
socket_path: /run/vigil/vigil.sock

# How long a finding stays in the local journal before it is dropped.
retention_days: 90

# What this host is watched for: a file, or a directory whose .yaml and .yml files are read
# in the order of their names, each holding the block of one or more collectors. A collector
# runs when its block is there and does not say `enabled: false`; one with no block does not
# run. `vigild collector <name> enable` and `disable` edit these files.
collectors_path: /etc/vigil/collectors

# What this host is expected to do, written out so the agent stays quiet about it: every
# .yaml or .yml file in this directory, read in the order of their names, each holding a
# `suppressions:` list. Every entry needs a reason, in your words. The console writes to
# console.yaml there.
#
#   suppressions:
#     - finding_key: "port.listen|tcp|0.0.0.0:8080"
#       reason: the staging api, expected on this host
suppressions_path: /etc/vigil/suppressions

# Where findings go: every .yaml or .yml file in this directory, each holding a `reporters:`
# list. None keeps them on this host, in the journal under state_dir. An entry names a kind:
# ndjson, syslog, webhook or host_findings. A file there may name a file with a token in it,
# so the directory is root's alone.
#
#   reporters:
#     - kind: ndjson
#       path: /var/log/vigil/findings.ndjson
reporters_path: /etc/vigil/reporters
